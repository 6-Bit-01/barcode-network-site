name: Apply provider API fail-soft patch

on:
  push:
    branches:
      - agent/provider-api-failsoft

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[provider-api-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out provider branch
        uses: actions/checkout@v4
        with:
          ref: agent/provider-api-failsoft
          fetch-depth: 0

      - name: Apply focused provider patch
        run: python3 scripts/apply-provider-api-failsoft.py

      - name: Remove temporary automation
        run: |
          rm -f scripts/apply-provider-api-failsoft.py
          rm -f .github/workflows/agent-provider-api-failsoft.yml

      - name: Commit exact changed tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json src/lib/provider-fetch.ts src/lib/track-duration.ts src/lib/queue.ts tests/provider-metadata-failsoft.test.mjs scripts/apply-provider-api-failsoft.py .github/workflows/agent-provider-api-failsoft.yml
          git diff --cached --check
          git commit -m "Harden provider metadata lookups [provider-api-applied]"
          git push origin HEAD:agent/provider-api-failsoft
