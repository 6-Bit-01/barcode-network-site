name: Apply Apple Music intake removal

on:
  push:
    branches:
      - agent/remove-apple-music-radio-intake

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused Apple Music intake removal
        run: python3 scripts/apply-apple-music-radio-intake.py

      - name: Remove temporary automation files
        run: |
          rm scripts/apply-apple-music-radio-intake.py
          rm .github/workflows/apply-apple-music-intake-removal.yml

      - name: Run focused regression
        run: node --test tests/apple-music-queue-boundary.test.mjs

      - name: Run queue suite
        run: npm run test:queue

      - name: Run full checks
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Verify diff
        run: git diff --check

      - name: Publish exact verified tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject Apple Music Radio intake"
          git push origin HEAD:${{ github.ref_name }}
