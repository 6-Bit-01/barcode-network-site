name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run check

      - name: Build production application
        run: npm run build

  windows-audio-bridge:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows audio bridge
        run: dotnet restore tools/barcode-audio-bridge/Barcode.AudioBridge.csproj

      - name: Restore Windows commercial player
        run: dotnet restore tools/barcode-commercial-player/Barcode.CommercialPlayer.csproj

      - name: Restore Windows audio bridge tests
        run: dotnet restore tools/barcode-audio-bridge.Tests/Barcode.AudioBridge.Tests.csproj

      - name: Verify Windows volume normalization
        run: dotnet test tools/barcode-audio-bridge.Tests/Barcode.AudioBridge.Tests.csproj -c Release --no-restore

      - name: Build Windows audio bridge
        run: dotnet build tools/barcode-audio-bridge/Barcode.AudioBridge.csproj -c Release --no-restore

      - name: Build Windows commercial player
        run: dotnet build tools/barcode-commercial-player/Barcode.CommercialPlayer.csproj -c Release --no-restore

      - name: Publish one-click Windows helper
        run: dotnet publish tools/barcode-audio-bridge/Barcode.AudioBridge.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/barcode-audio-bridge

      - name: Publish one-click commercial player
        run: dotnet publish tools/barcode-commercial-player/Barcode.CommercialPlayer.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/barcode-commercial-player

      - name: Upload Windows helper
        uses: actions/upload-artifact@v4
        with:
          name: barcode-audio-bridge-win-x64
          path: artifacts/barcode-audio-bridge/BARCODE.AudioBridge.exe
          if-no-files-found: error

      - name: Upload Windows commercial player
        uses: actions/upload-artifact@v4
        with:
          name: barcode-commercial-player-win-x64
          path: artifacts/barcode-commercial-player/BARCODE.CommercialPlayer.exe
          if-no-files-found: error
