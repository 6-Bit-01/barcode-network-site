name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out provider branch
        uses: actions/checkout@v4
        with:
          ref: agent/provider-api-failsoft
          fetch-depth: 0

      - name: Apply focused provider hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-provider-api-failsoft.py")
          text = path.read_text()
          old = "re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)"
          new = "re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)"
          if old not in text:
              raise SystemExit("expected regex helper line not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/apply-provider-api-failsoft.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("package.json")
          package = json.loads(path.read_text())
          package["scripts"]["build"] = "next build"
          path.write_text(json.dumps(package, indent=2) + "\n")
          PY
          rm -f scripts/apply-provider-api-failsoft.py
          rm -f .github/workflows/agent-provider-api-failsoft.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden provider metadata lookups"
          git push origin HEAD:agent/provider-api-failsoft

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run check

      - name: Build production application
        run: npm run build
